<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Patcher Pro - Web Engine</title>
<style>
  :root {
    --bg-deep: #090b10;
    --bg-mid: #12151d;
    --glow-cool: rgba(130, 180, 255, 0.14);
    --glow-warm: rgba(255, 170, 90, 0.08);

    --glass: rgba(255, 255, 255, 0.05);
    --glass-strong: rgba(255, 255, 255, 0.09);
    --glass-hi: rgba(255, 255, 255, 0.14);
    --border-glass: rgba(255, 255, 255, 0.13);
    --border-glass-soft: rgba(255, 255, 255, 0.07);

    --ink: #eef2f8;
    --ink-dim: #93a0b3;
    --ink-faint: #5b6577;

    --moon: #a7d8ff;
    --moon-dim: rgba(167, 216, 255, 0.45);

    --flare: #ffb454;
    --flare-2: #ffd18a;
    --flare-dim: #c9873a;

    --success: #5be49b;
    --error: #ff7a70;

    --radius-lg: 16px;
    --radius-md: 12px;

    --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(140% 100% at 88% -20%, var(--glow-cool), transparent 55%),
      radial-gradient(100% 80% at 4% 118%, var(--glow-warm), transparent 62%),
      linear-gradient(165deg, var(--bg-mid), var(--bg-deep) 70%);
    color: var(--ink);
    font-family: var(--sans);
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(18, 21, 29, 0.65);
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-lg);
    padding: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border-glass-soft);
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
  }

  .wordmark .pro-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--moon);
    background: rgba(167, 216, 255, 0.09);
    border: 1px solid rgba(167, 216, 255, 0.28);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .tagline {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  .field { margin-bottom: 20px; }

  .drop {
    display: block;
    border: 2px dashed var(--border-glass);
    border-radius: var(--radius-lg);
    background: linear-gradient(160deg, var(--glass-strong), var(--glass));
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .drop:hover, .drop.dragover {
    border-color: var(--moon);
    background: rgba(167, 216, 255, 0.08);
  }

  .drop-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }

  .drop-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 6px;
  }

  input[type="file"] { display: none; }

  button#patchBtn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(160deg, var(--flare-2), var(--flare) 55%, var(--flare-dim));
    color: #1c1400;
    border: none;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 20px -5px rgba(255, 180, 84, 0.4);
    transition: transform 0.1s ease, filter 0.15s ease;
  }

  button#patchBtn:hover { filter: brightness(1.08); }
  button#patchBtn:active { transform: scale(0.99); }

  #status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border-glass-soft);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    display: none;
    word-break: break-word;
  }
</style>
</head>
<body>

  <div class="card">
    <header>
      <div>
        <div class="wordmark">moon patcher <span class="pro-badge">WEB PRO</span></div>
        <div class="tagline">4K · Video Patching Engine</div>
      </div>
    </header>

    <div class="field">
      <label class="drop" id="dropArea" for="inputFile">
        <div class="drop-text" id="dropText">ჩააგდე MP4 ვიდეო აქ</div>
        <div class="drop-sub" id="dropSub">ან დააჭირე ფაილის ასარჩევად</div>
      </label>
      <input type="file" id="inputFile" accept="video/mp4" />
    </div>

    <button id="patchBtn">დაპატჩვა და ჩამოტვირთვა</button>
    <div id="status"></div>
  </div>

  <!-- ბირთვი და საიტის ლოგიკა -->
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
